<path d="M1130,368.0 L1130,272.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1205.0,240 L1246,240" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1310,192 L1310,112.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1318" y="160" text-anchor="start" fill="#222" font-size="13">no</text>
<path d="M1374,240 L1415.0,240" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1394.5" y="233" text-anchor="middle" fill="#222" font-size="13">yes</text>
<path d="M1490,208.0 L1490,80 L1595.0,80" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1670,112.0 L1670,560 L1792,560" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1908,560 L2030,560 L2030,112.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="2022" y="394" text-anchor="end" fill="#222" font-size="13">no — new version</text>
<text x="2022" y="412" text-anchor="end" fill="#555" font-size="12">with Word</text>
<text x="2022" y="427" text-anchor="end" fill="#555" font-size="12">track changes</text>
<path d="M2030,48.0 L2030,16 L590,16 L590,208.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="950.0" y="11" text-anchor="middle" fill="#555" font-size="12">new version — back to review</text>
