<path d="M1850,604 L1850,626 L2135,626 L2135,34 L1340,34 L1340,48.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1992.5" y="620" text-anchor="middle" fill="#222" font-size="13">yes</text>
<rect x="710" y="614" width="14" height="14" rx="3" fill="#eaf1fb" stroke="#2c5d9a"/>
<text x="730" y="625.5" text-anchor="start" fill="#555" font-size="12">done by the Product</text>
