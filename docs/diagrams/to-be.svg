<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2170 640" width="2170" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>TO-BE: contract approval with the Product</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
