<text x="770" y="387.5" text-anchor="middle" fill="#222">identifiers:</text>
<text x="770" y="404.5" text-anchor="middle" fill="#222">names, e-mail,</text>
<text x="770" y="421.5" text-anchor="middle" fill="#222">phone, PESEL,</text>
<text x="770" y="438.5" text-anchor="middle" fill="#222">NIP, KRS, IBAN</text>
