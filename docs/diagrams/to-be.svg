<text x="950" y="370.5" text-anchor="middle" fill="#222">Analyses contract</text>
<text x="950" y="387.5" text-anchor="middle" fill="#222">against the</text>
<text x="950" y="404.5" text-anchor="middle" fill="#222">playbook and</text>
<text x="950" y="421.5" text-anchor="middle" fill="#222">Polish</text>
<text x="950" y="438.5" text-anchor="middle" fill="#222">legislation</text>
