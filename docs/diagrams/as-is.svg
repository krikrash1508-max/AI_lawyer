<path d="M1000,208.0 L1000,80 L1115.0,80" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1190,112.0 L1190,400 L1322,400" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1380,356 L1380,112.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1380,48.0 L1380,18 L620,18 L620,208.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M1438,400 L1570,400 L1570,112.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1390" y="234" fill="#222">no — new version</text>
<text x="1390" y="252" fill="#555" font-size="12">with Word track changes</text>
<text x="1504.0" y="392" text-anchor="middle" fill="#222">yes</text>
<text x="1000.0" y="13" text-anchor="middle" fill="#555" font-size="12">back to the queue</text>
<rect x="750" y="454" width="14" height="14" rx="3" fill="#fdecea" stroke="#c0392b"/>
<text x="770" y="465.5" fill="#555" font-size="12">bottleneck</text>
