<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 480" width="1660" height="480" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>AS-IS: contract approval today</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1660" height="480" fill="#ffffff"/>
