<text x="1390" y="252" fill="#555" font-size="12">в режиме исправлений Word</text>
<text x="1504.0" y="392" text-anchor="middle" fill="#222">да</text>
<text x="1000.0" y="13" text-anchor="middle" fill="#555" font-size="12">снова в очередь</text>
<rect x="750" y="454" width="14" height="14" rx="3" fill="#fdecea" stroke="#c0392b"/>
<text x="770" y="465.5" fill="#555" font-size="12">узкое место</text>
