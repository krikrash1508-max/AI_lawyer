<text x="430" y="93.0" text-anchor="middle" fill="#222">«посмотри, срочно»</text>
<rect x="545.0" y="208.0" width="150" height="64" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
