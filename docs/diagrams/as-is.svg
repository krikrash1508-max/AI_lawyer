<text x="810" y="244.5" text-anchor="middle" fill="#222">checks the playbook</text>
<text x="810" y="261.5" text-anchor="middle" fill="#222">from memory</text>
<rect x="925.0" y="208.0" width="150" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1000" y="227.5" text-anchor="middle" fill="#222">Manual edits</text>
<text x="1000" y="244.5" text-anchor="middle" fill="#222">in Word, explanation</text>
<text x="1000" y="261.5" text-anchor="middle" fill="#222">in an e-mail</text>
<rect x="1115.0" y="48.0" width="150" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1190" y="76.0" text-anchor="middle" fill="#222">Sends edits</text>
<text x="1190" y="93.0" text-anchor="middle" fill="#222">to counterparty</text>
<rect x="1305.0" y="48.0" width="150" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1380" y="76.0" text-anchor="middle" fill="#222">Forwards new</text>
<text x="1380" y="93.0" text-anchor="middle" fill="#222">version to lawyer</text>
<rect x="1495.0" y="48.0" width="150" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1570" y="84.5" text-anchor="middle" fill="#222">Signing</text>
