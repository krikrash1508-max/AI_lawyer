<path d="M430,112.0 L430,240 L545.0,240" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M695.0,240 L735.0,240" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
