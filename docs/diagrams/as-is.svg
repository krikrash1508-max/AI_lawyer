<text x="1000" y="244.5" text-anchor="middle" fill="#222">в Word, объяснение</text>
<text x="1000" y="261.5" text-anchor="middle" fill="#222">в письме</text>
<rect x="1115.0" y="48.0" width="150" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
