<rect x="0.5" y="320.5" width="140" height="160" fill="#e9e6dc" stroke="#8a8a8a"/>
<text x="70.0" y="405.0" text-anchor="middle" font-weight="bold" font-size="14" fill="#222">Counterparty</text>
<rect x="165.0" y="48.0" width="150" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="240" y="76.0" text-anchor="middle" fill="#222">Receives contract</text>
<text x="240" y="93.0" text-anchor="middle" fill="#222">from counterparty</text>
<rect x="355.0" y="48.0" width="150" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="430" y="76.0" text-anchor="middle" fill="#222">E-mail to lawyer</text>
<text x="430" y="93.0" text-anchor="middle" fill="#222">“please review, urgent”</text>
<rect x="545.0" y="208.0" width="150" height="64" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="620" y="227.5" text-anchor="middle" fill="#222">Queue ~2 days</text>
<text x="620" y="244.5" text-anchor="middle" fill="#222">for each round</text>
<text x="620" y="261.5" text-anchor="middle" fill="#222">of edits</text>
